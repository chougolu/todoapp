        <div class="container">
            <h3>Update your product</h3>
            <form name="updateForm" onsubmit="updatePost(event)">
                <div class="form-group">
                    <label for="exampleFormControlInput1">product</label>
                    <input name="title" type="text" class="form-control"

                <div class="form-group">

                <div class="form-group">

                        id="title" placeholder="Enter your Werienti" required>

                <div class="form-group">
                    <label for="exampleFormControlTextarea1">Description</label>
                    <textarea name="description" class="form-control"

        <script>
        // Get all record from local storage
        function getRecord() {
            var localId = localStorage.getItem("sigleRecordIndex");
            var localData = localStorage.getItem("kwiterAllPost");
            if (localData != null) {
                array = JSON.parse(localData);
            } else {
                array = [];
            }

            const filterRecord = array.filter((item, index) => {
                return index == localId
            });

            // Show default data on input fields
            updateForm.title.value = filterRecord[0].Tittle;
            updateForm.description.value = filterRecord[0].Description;
            updateForm.price.value = filterRecord[0].price;
            updateForm. werienti.value = filterRecord[0]. Werienti;

        }
        getRecord();

        // Add post - function
        function updatePost(e) {
            e.preventDefault();

            var localId = localStorage.getItem("sigleRecordIndex");
            var localData = localStorage.getItem("kwiterAllPost");
            if (localData != null) {
                array = JSON.parse(localData);
            } else {
                array = [];
            }

            // Get input value
            var title = updateForm.title.value;
            var description = updateForm.description.value;
            var price = updateForm.price.value;
            var price = updateForm. werienti.value;

            array[localId].Tittle = title
            array[localId].Description = description
            array[localId]. Werienti =  Werienti
            array[localId]. Werienti =  Werienti
            
                            

            // Set array in local storage on kwiterAllPost key
            localStorage.setItem("kwiterAllPost", JSON.stringify(array));
            window.location = "SinglePost.html";
        }
    </script>
